name: PixelDrain ROM to Telegram (Interactive)

on:
  workflow_dispatch:
    inputs:
      url:
        description: Link ROM (Telegram t.me, Pixeldrain, atau direct link)
        required: true
        default: https://pixeldrain.com/u/DHRQX76G

permissions:
  contents: read

concurrency:
  group: rom-to-telegram-interactive
  cancel-in-progress: false

jobs:
  rom-bot:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full python3-pip
          python3 -m pip install telethon cryptg

      - name: Download ROM
        shell: bash
        env:
          ROM_URL: ${{ inputs.url }}
          PD_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
          TELE_API_ID: ${{ secrets.TELE_API_ID }}
          TELE_API_HASH: ${{ secrets.TELE_API_HASH }}
          TELE_SESSION: ${{ secrets.TELE_SESSION }}
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/rom-work"
          mkdir -p "$WORK/dl"

          [[ "$ROM_URL" =~ ^https?:// ]] || { echo "URL harus diawali http:// atau https://"; exit 1; }

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

          if [[ "$ROM_URL" =~ ^https?://t\.me/ ]]; then
            echo "Link Telegram terdeteksi."
            python3 - <<'PY'
          import asyncio
          import os
          import re
          import sys
          import time
          from pathlib import Path

          from telethon import TelegramClient
          from telethon.sessions import StringSession

          url = os.environ["ROM_URL"].strip()
          DL = Path(os.environ["RUNNER_TEMP"]) / "rom-work" / "dl"
          DL.mkdir(parents=True, exist_ok=True)

          m = re.match(
              r"^https?://t\.me/(?:c/(\d+)|([A-Za-z0-9_]+))/(?:\d+/)?(\d+)/?(?:\?.*)?$",
              url,
          )
          if not m:
              sys.exit("Format link Telegram tidak dikenali (contoh: https://t.me/channel/123)")

          private_id, username, msg_id = m.group(1), m.group(2), int(m.group(3))
          target = int("-100" + private_id) if private_id else username

          for k in ("TELE_API_ID", "TELE_API_HASH", "TELE_SESSION"):
              if not os.environ.get(k):
                  sys.exit(f"Secret {k} kosong")

          last = [0.0]


          def progress(done, total):
              now = time.time()
              if now - last[0] >= 10 or done == total:
                  last[0] = now
                  print(f"  {done / 1024 / 1024:.0f} / {total / 1024 / 1024:.0f} MiB "
                        f"({done * 100 // max(total, 1)}%)", flush=True)


          async def main():
              client = TelegramClient(
                  StringSession(os.environ["TELE_SESSION"]),
                  int(os.environ["TELE_API_ID"]),
                  os.environ["TELE_API_HASH"],
                  connection_retries=5,
                  request_retries=5,
              )
              await client.connect()
              try:
                  if not await client.is_user_authorized():
                      sys.exit("TELE_SESSION tidak valid / expired, buat session baru.")

                  msg = await client.get_messages(target, ids=msg_id)
                  if not msg or not msg.media:
                      sys.exit("Pesan tidak ditemukan atau tidak ada file/media-nya.")

                  size = getattr(getattr(msg, "file", None), "size", 0) or 0
                  print(f"Mengunduh {msg.file.name or 'file'} ({size / 1024 / 1024:.0f} MiB)...")
                  path = await client.download_media(
                      msg, file=str(DL) + os.sep, progress_callback=progress
                  )
                  if not path or not Path(path).is_file() or Path(path).stat().st_size == 0:
                      sys.exit("Download dari Telegram gagal.")
                  print(f"OK: {path}")
              finally:
                  await client.disconnect()


          asyncio.run(main())
          PY
          elif [[ "$ROM_URL" =~ pixeldrain\.(com|net)/(u|api/file)/([A-Za-z0-9]+) ]]; then
            FILE_ID="${BASH_REMATCH[3]}"
            echo "Pixeldrain terdeteksi: $FILE_ID"

            AUTH=()
            if [ -n "${PD_KEY:-}" ]; then
              AUTH=(-u ":$PD_KEY")
              echo "Pakai Pixeldrain API key."
            fi

            NAME=$(curl -sL -A "$UA" "${AUTH[@]}" \
              "https://pixeldrain.com/api/file/$FILE_ID/info" \
              | python3 -c "import sys,json;print(json.load(sys.stdin)['name'])" \
              2>/dev/null || true)
            NAME=$(basename "${NAME:-rom.zip}")
            [ -n "$NAME" ] || NAME="rom.zip"
            OUTF="$WORK/dl/$NAME"

            HTTP=$(curl -sL -A "$UA" "${AUTH[@]}" \
              -e "https://pixeldrain.com/u/$FILE_ID" \
              --connect-timeout 30 --max-time 7200 \
              -w '%{http_code}' -o "$OUTF" \
              "https://pixeldrain.com/api/file/$FILE_ID?download" || true)

            if [ "$HTTP" != "200" ] || [ ! -s "$OUTF" ]; then
              echo "Pixeldrain menolak (HTTP $HTTP):"
              head -c 600 "$OUTF" 2>/dev/null || true
              echo
              echo "Pixeldrain memblokir download dari server kecuali akun berbayar."
              echo "Pakai link host lain (direct link) atau API key akun Pixeldrain berbayar."
              exit 1
            fi
          else
            echo "Direct link biasa."
            cd "$WORK/dl"
            curl -fL -OJ -A "$UA" --retry 3 --retry-delay 5 \
              --connect-timeout 30 --max-time 7200 "$ROM_URL"
          fi

          test -n "$(ls -A "$WORK/dl")"
          ls -lh "$WORK/dl"

      - name: Interactive Telegram bot
        env:
          TELE_API_ID: ${{ secrets.TELE_API_ID }}
          TELE_API_HASH: ${{ secrets.TELE_API_HASH }}
          BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import asyncio
          import json
          import os
          import shutil
          import urllib.parse
          import urllib.request
          from pathlib import Path

          from telethon import TelegramClient, events, Button
          from telethon.sessions import StringSession
          from telethon.errors import MessageNotModifiedError

          WORK = Path(os.environ["RUNNER_TEMP"]) / "rom-work"
          DL = WORK / "dl"
          EXT = WORK / "extracted"
          OUT = WORK / "out"

          API_ID = int(os.environ.get("TELE_API_ID") or 0)
          API_HASH = os.environ.get("TELE_API_HASH", "")
          TOKEN = os.environ.get("BOT_TOKEN", "").strip()
          CHAT = int(os.environ.get("TG_CHAT_ID") or 0)

          PAGE = 8                     # item per halaman
          IDLE = 300                   # detik nunggu klik (5 menit)
          LIMIT = 1900 * 1024 * 1024   # batas per file Telegram (~2GB)

          for _k, _v in (("TG_BOT_TOKEN", TOKEN), ("TELE_API_ID", str(API_ID)),
                         ("TELE_API_HASH", API_HASH), ("TG_CHAT_ID", str(CHAT))):
              if not _v or _v == "0":
                  raise SystemExit(f"Secret {_k} kosong / belum di-set di Settings > Secrets and variables > Actions")
          if ":" not in TOKEN:
              raise SystemExit("TG_BOT_TOKEN formatnya salah, harus seperti 123456789:AAxxxx (dari @BotFather)")

          queue = asyncio.Queue()

          MENU = [
              [("📤 Kirim full ROM", "m:full")],
              [("📂 Unpack & pilih file", "m:unpack")],
              [("✅ Selesai (cukup download)", "m:done")],
          ]


          # ---------- helpers ----------
          def human(n):
              for u in ("B", "KB", "MB", "GB"):
                  if n < 1024:
                      return f"{n:.0f} {u}" if u == "B" else f"{n:.1f} {u}"
                  n /= 1024
              return f"{n:.1f} TB"


          def dir_size(p):
              return sum(f.stat().st_size for f in p.rglob("*") if f.is_file())


          def tl(rows):
              return [[Button.inline(l, d.encode()) for l, d in r] for r in rows]


          def tg_send(text, rows=None):
              """Kirim pesan lewat Bot API (aman walau entity belum dikenal)."""
              data = {"chat_id": str(CHAT), "text": text}
              if rows:
                  data["reply_markup"] = json.dumps({
                      "inline_keyboard": [
                          [{"text": l, "callback_data": d} for l, d in r]
                          for r in rows
                      ]
                  })
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{TOKEN}/sendMessage",
                  urllib.parse.urlencode(data).encode(),
              )
              urllib.request.urlopen(req, timeout=30).read()


          async def run(cmd, cwd=None):
              p = await asyncio.create_subprocess_exec(
                  *cmd, cwd=cwd,
                  stdout=asyncio.subprocess.PIPE,
                  stderr=asyncio.subprocess.STDOUT,
              )
              out, _ = await p.communicate()
              return p.returncode, out.decode(errors="ignore")


          async def edit(ev, text, rows=None):
              try:
                  await ev.edit(text, buttons=tl(rows) if rows else None)
              except MessageNotModifiedError:
                  pass


          async def wait_click():
              try:
                  return await asyncio.wait_for(queue.get(), IDLE)
              except asyncio.TimeoutError:
                  return None


          async def send_path(client, chat, path, label=None):
              """Kirim file/folder. Folder di-zip, file >1.9GB dipecah."""
              shutil.rmtree(OUT, ignore_errors=True)
              OUT.mkdir(parents=True)
              name = label or path.name
              note = ""

              if path.is_dir():
                  base = OUT / f"{name}.zip"
                  rc, log = await run(
                      ["7z", "a", "-tzip", "-mx0", "-v1900m",
                       str(base), path.name],
                      cwd=str(path.parent),
                  )
                  if rc != 0:
                      raise RuntimeError(f"zip gagal:\n{log[-500:]}")
                  parts = sorted(OUT.iterdir())
                  if len(parts) == 1:
                      parts = [parts[0].rename(OUT / f"{name}.zip")]
                  else:
                      note = "Multi-part zip: taruh semua part satu folder, buka .001 dengan 7-Zip."
              else:
                  if path.stat().st_size <= LIMIT:
                      parts = [path]
                  else:
                      rc, log = await run([
                          "split", "-b", "1900M", "-d", "-a", "2",
                          str(path), str(OUT / f"{name}.part"),
                      ])
                      if rc != 0:
                          raise RuntimeError(f"split gagal:\n{log[-500:]}")
                      parts = sorted(OUT.iterdir())
                      note = f"Gabung: cat {name}.part* > {name}"

              n = len(parts)
              for i, part in enumerate(parts, 1):
                  cap = name if n == 1 else f"{name} — part {i}/{n}"
                  await client.send_file(
                      chat, str(part),
                      caption=cap,
                      force_document=True,
                      part_size_kb=512,
                  )
              if note:
                  await client.send_message(chat, note)
              shutil.rmtree(OUT, ignore_errors=True)


          # ---------- main ----------
          async def main():
              rom = next(DL.iterdir())
              client = TelegramClient(StringSession(), API_ID, API_HASH,
                                      connection_retries=3, request_retries=3)
              await client.start(bot_token=TOKEN)

              async def on_click(ev):
                  if ev.chat_id != CHAT:
                      await ev.answer("Bukan buat kamu", alert=True)
                      return
                  await queue.put(ev)

              client.add_event_handler(on_click, events.CallbackQuery())

              tg_send(
                  f"✅ ROM selesai didownload\n{rom.name} ({human(rom.stat().st_size)})\n\nMau diapakan?",
                  MENU,
              )

              extracted = False
              cwd = EXT
              page = 0
              listing = []

              async def show(ev):
                  nonlocal listing, page
                  listing = sorted(
                      cwd.iterdir(),
                      key=lambda p: (p.is_file(), p.name.lower()),
                  )
                  total = max(1, (len(listing) + PAGE - 1) // PAGE)
                  page = max(0, min(page, total - 1))

                  rows = []
                  for i in range(page * PAGE, min(len(listing), (page + 1) * PAGE)):
                      p = listing[i]
                      if p.is_dir():
                          rows.append([(f"📁 {p.name}"[:40], f"o:{i}"),
                                       ("⬇️ zip", f"z:{i}")])
                      else:
                          rows.append([(f"📄 {p.name} · {human(p.stat().st_size)}"[:60],
                                        f"f:{i}")])

                  nav = []
                  if page > 0:
                      nav.append(("◀️", "p:prev"))
                  nav.append((f"{page + 1}/{total}", "p:noop"))
                  if page < total - 1:
                      nav.append(("▶️", "p:next"))
                  rows.append(nav)

                  ctrl = []
                  if cwd != EXT:
                      ctrl.append(("⬆️ Naik", "u"))
                  ctrl.append(("📦 Zip folder ini", "zc"))
                  rows.append(ctrl)
                  rows.append([("🏠 Menu", "m:menu"), ("✅ Selesai", "m:done")])

                  rel = "/" if cwd == EXT else "/" + str(cwd.relative_to(EXT))
                  await edit(ev, f"📂 {rel}\n{len(listing)} item\nTap 📄 = kirim file, 📁 = buka, ⬇️ = kirim zip", rows)

              async def deliver(ev, chat, path, label=None):
                  st = await client.send_message(chat, f"⏳ Menyiapkan & mengirim {label or path.name}...")
                  try:
                      await send_path(client, chat, path, label)
                  except Exception as e:
                      await client.send_message(chat, f"❌ Gagal: {e}")
                  finally:
                      await st.delete()

              while True:
                  ev = await wait_click()
                  if ev is None:
                      tg_send("⏰ Tidak ada respon 5 menit, workflow dihentikan.")
                      break

                  await ev.answer()
                  chat = await ev.get_input_chat()
                  d = ev.data.decode()

                  try:
                      if d == "m:done":
                          await edit(ev, "✅ Selesai. Workflow dihentikan.",
                                     [[("✅ Selesai", "x")]])
                          break

                      elif d == "m:menu":
                          await edit(ev, "Mau diapakan?", MENU)

                      elif d == "m:full":
                          await deliver(ev, chat, rom)
                          await edit(ev, "✅ Full ROM terkirim.\n\nMau diapakan lagi?", MENU)

                      elif d == "m:unpack":
                          if not extracted:
                              await edit(ev, "⏳ Unpacking ROM...")
                              rc, log = await run(["7z", "x", str(rom), f"-o{EXT}", "-y"])
                              if rc != 0:
                                  await edit(ev, f"❌ Unpack gagal:\n{log[-500:]}", MENU)
                                  continue
                              extracted = True
                          cwd, page = EXT, 0
                          await show(ev)

                      elif not extracted:
                          await ev.answer("Unpack dulu", alert=True)

                      elif d == "p:next":
                          page += 1
                          await show(ev)
                      elif d == "p:prev":
                          page -= 1
                          await show(ev)
                      elif d == "p:noop":
                          pass
                      elif d == "u":
                          cwd, page = cwd.parent, 0
                          await show(ev)
                      elif d == "zc":
                          label = rom.stem if cwd == EXT else cwd.name
                          await deliver(ev, chat, cwd, label)

                      elif d[:2] in ("o:", "z:", "f:"):
                          i = int(d[2:])
                          if not (0 <= i < len(listing)):
                              continue
                          p = listing[i]
                          if d[0] == "o":
                              cwd, page = p, 0
                              await show(ev)
                          else:  # z (zip folder) atau f (file)
                              await deliver(ev, chat, p)
                  except Exception as e:
                      tg_send(f"❌ Error: {e}")

              await client.disconnect()


          asyncio.run(main())
          PY

      - name: Remove temporary files
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/rom-work"
          echo "Temporary ROM files removed."
