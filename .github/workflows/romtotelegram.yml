
name: PixelDrain ROM to Telegram User

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rom-to-telegram-user
  cancel-in-progress: false

jobs:
  download-extract-send:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full python3-pip
          python3 -m pip install telethon

      - name: Download ROM
        shell: bash
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/rom-work"
          mkdir -p "$WORK/extracted"

          curl -fL --retry 3 --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 7200 \
            "https://pixeldrain.com/api/file/9tcNaYNe?download" \
            -o "$WORK/rom-download"

          test -s "$WORK/rom-download"
          echo "ROM downloaded successfully."
          ls -lh "$WORK/rom-download"

      - name: Extract ROM
        shell: bash
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/rom-work"

          7z x "$WORK/rom-download" \
            -o"$WORK/extracted" -y

          echo "ROM extraction completed."

      - name: Send vendor files using Telegram account
        env:
          TELE_API_ID: ${{ secrets.TELE_API_ID }}
          TELE_API_HASH: ${{ secrets.TELE_API_HASH }}
          TELE_SESSION: ${{ secrets.TELE_SESSION }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import asyncio
          import os
          import sys
          from pathlib import Path
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          WORK = Path(os.environ["RUNNER_TEMP"]) / "rom-work"
          ROOT = WORK / "extracted"

          api_id = int(os.environ["TELE_API_ID"])
          api_hash = os.environ["TELE_API_HASH"]
          session = os.environ["TELE_SESSION"]
          chat_id = int(os.environ["TG_CHAT_ID"])

          TARGETS = [
              "vendor.new.dat.br",
              "vendor.patch.dat",
              "vendor.transfer.list",
          ]

          async def main():
              client = TelegramClient(
                  StringSession(session),
                  api_id,
                  api_hash,
                  connection_retries=3,
                  request_retries=3,
              )

              await client.connect()

              try:
                  if not await client.is_user_authorized():
                      raise RuntimeError(
                          "Session is unauthorized. Create a new "
                          "Telethon session locally and update TELE_SESSION."
                      )

                  destination = await client.get_input_entity(chat_id)

                  for name in TARGETS:
                      matches = sorted(
                          p for p in ROOT.rglob(name) if p.is_file()
                      )

                      if not matches:
                          await client.send_message(
                              destination,
                              f"ROM extraction: {name} was not found."
                          )
                          print(f"Not found: {name}")
                          continue

                      path = matches[0]
                      size = path.stat().st_size

                      if size == 0:
                          await client.send_message(
                              destination,
                              f"{name} exists in the ROM but is empty (0 bytes)."
                          )
                          print(f"Empty file: {name}")
                          continue

                      print(
                          f"Sending {name} ({size / 1024 / 1024:.2f} MiB)"
                      )

                      await client.send_file(
                          destination,
                          str(path),
                          caption=name,
                          force_document=True,
                          part_size_kb=512,
                          progress_callback=lambda sent, total: None,
                      )

                      print(f"Sent: {name}")

                  await client.send_message(
                      destination,
                      "ROM vendor file processing completed."
                  )

              finally:
                  await client.disconnect()

          asyncio.run(main())
          PY

      - name: Remove temporary files
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/rom-work"
          echo "Temporary ROM files removed."
