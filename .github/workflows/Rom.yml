name: Extract init from ROM

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: "Direct/sourceforge URL to the ROM zip"
        required: true
        default: "https://sourceforge.net/projects/infinity-x/files/whyred/16/vanilla/Project_Infinity-X-3.11-whyred-11.06.2026-VANILLA-OFFICIAL.zip/download"
      mirror_url:
        description: "Optional: a direct *.dl.sourceforge.net mirror URL copied from your browser's download link, used if sourceforge.net blocks the runner"
        required: false
        default: ""
      init_path:
        description: "Path of init inside system.img (try /bin/init first, fallback /system/bin/init)"
        required: true
        default: "/bin/init"

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli python3 e2fsprogs unzip curl

      - name: Download ROM zip
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          URL="${{ github.event.inputs.rom_url }}"
          MANUAL_MIRROR="${{ github.event.inputs.mirror_url }}"

          fetch() {
            echo "Fetching: $1"
            curl -sS -L -A "$UA" --retry 5 --retry-delay 5 --retry-connrefused \
              -D headers.txt -o rom.zip "$1"
          }

          # `file` sometimes misreports a valid zip as "Java archive data
          # (JAR)" because zip/jar/apk all share the same PK magic bytes.
          # Check the actual central directory instead.
          is_zip() { python3 -c "import zipfile,sys; sys.exit(0 if zipfile.is_zipfile('rom.zip') else 1)"; }

          # If this is a pixeldrain share link, convert it to the direct
          # file-download API endpoint first (pixeldrain isn't behind a
          # Cloudflare bot challenge, so this usually just works).
          PD_ID=$(echo "$URL" | sed -nE 's#^https?://pixeldrain\.com/u/([A-Za-z0-9]+).*#\1#p')
          if [ -n "$PD_ID" ]; then
            URL="https://pixeldrain.com/api/file/${PD_ID}"
            echo "Detected pixeldrain link, using direct API URL: $URL"
          fi

          # Attempt 1: the given URL (sourceforge.net project pages are
          # often blocked by a Cloudflare bot challenge when requested from
          # datacenter IPs like GitHub Actions runners; pixeldrain direct
          # links normally work on the first try).
          fetch "$URL"
          echo "Attempt 1 type: $(file -b rom.zip)"

          # Attempt 2: derive the downloads.sourceforge.net redirector URL,
          # which is a separate legacy service that sometimes isn't behind
          # the same Cloudflare challenge as the main site.
          if ! is_zip; then
            PROJECT_PATH=$(echo "$URL" | sed -E 's#^https?://sourceforge\.net/projects/([^/]+)/files/(.+)/download/?$#\1/\2#')
            if [ "$PROJECT_PATH" != "$URL" ]; then
              ALT_URL="https://downloads.sourceforge.net/project/${PROJECT_PATH}"
              fetch "$ALT_URL"
              echo "Attempt 2 type: $(file -b rom.zip)"
            fi
          fi

          # Attempt 3: a mirror URL the user copied by hand from a real
          # browser (e.g. right-click the download button -> copy link, or
          # read it from the browser's network tab) - this is a human
          # request so it clears the Cloudflare challenge.
          if ! is_zip && [ -n "$MANUAL_MIRROR" ]; then
            fetch "$MANUAL_MIRROR"
            echo "Attempt 3 type: $(file -b rom.zip)"
          fi

          ls -lh rom.zip
          file rom.zip
          if ! is_zip; then
            echo "::error::Could not get a real zip file. SourceForge is likely challenging this runner's IP. Dumping response headers and first 2KB of the body for debugging; re-run with a manual mirror_url if needed."
            cat headers.txt || true
            echo "---- body preview ----"
            head -c 2000 rom.zip || true
            exit 1
          fi

      - name: List zip contents
        run: unzip -l rom.zip | tee zip_listing.txt

      - name: Extract system.new.dat.br and transfer list
        run: |
          mkdir -p work
          unzip -o rom.zip "system.new.dat.br" "system.transfer.list" -d work || \
          unzip -o rom.zip "*/system.new.dat.br" "*/system.transfer.list" -d work
          find work -maxdepth 3 -iname "system.new.dat.br" -o -iname "system.transfer.list"

      - name: Decompress .br to .dat
        run: |
          cd work
          f=$(find . -iname "system.new.dat.br" | head -n1)
          brotli -d "$f" -o system.new.dat
          ls -lh system.new.dat

      - name: Get sdat2img.py
        run: |
          curl -L -o sdat2img.py \
            https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py

      - name: Convert sparse data to system.img
        run: |
          tlist=$(find work -iname "system.transfer.list" | head -n1)
          python3 sdat2img.py "$tlist" work/system.new.dat system.img
          ls -lh system.img
          file system.img

      - name: Extract init binary with debugfs
        run: |
          mkdir -p out
          set -e
          PATH1="${{ github.event.inputs.init_path }}"
          echo "Trying $PATH1"
          debugfs -R "dump $PATH1 out/init" system.img || true
          if [ ! -s out/init ]; then
            echo "Trying fallback /system/bin/init"
            debugfs -R "dump /system/bin/init out/init" system.img || true
          fi
          ls -l out/
          file out/init || true

      - name: Record SELinux label and mode (for later re-insertion)
        run: |
          debugfs -R "ls -l $(dirname ${{ github.event.inputs.init_path }})" system.img | tee out/dir_listing.txt
          debugfs -R "ea_list ${{ github.event.inputs.init_path }}" system.img | tee out/selinux_label.txt || true

      - name: Upload init binary
        uses: actions/upload-artifact@v4
        with:
          name: init-binary
          path: |
            out/init
            out/dir_listing.txt
            out/selinux_label.txt
          if-no-files-found: error

